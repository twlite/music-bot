name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - run: npm install --global pnpm@12.18.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - name: Install prebuilt FFmpeg runtime
        run: |
          curl -fsSL https://raw.githubusercontent.com/twlite/remedia/d3cfa5b7b6644dc5e29142a0722294c933f1159c/scripts/install.sh -o /tmp/install-remedia.sh
          sh /tmp/install-remedia.sh --ffmpeg-only
      - run: pnpm --filter music-bot test:native
